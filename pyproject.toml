[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lagtcn"
version = "0.2.0"
description = "Level-Aware Graph-Temporal Co-Evolution for hierarchical load forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch==2.3.0",
  "numpy==1.26.4",
  "pandas==1.3.5",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "threadpoolctl==3.6.0",
]

[tool.setuptools]
packages = ["lagtcn"]
